[workspace]
resolver = "2"

[package]
name = "weimo-wdf"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Weimo <weimo@weimo.cc>"]
description = "Strict canonical rich-text document model with adapters for Markdown, Tiptap/ProseMirror JSON, Apple document JSON, and terminal output"
license = "MIT"
repository = "https://github.com/jiaowenjun/weimo-wdf-rs"
homepage = "https://github.com/jiaowenjun/weimo-wdf-rs"
readme = "README.md"
keywords = ["wdf", "document", "markdown", "tiptap", "rich-text"]
categories = ["text-processing", "encoding"]

[lib]
name = "weimo_wdf"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
