name: CI (TypeScript)

on:
  push:
    branches:
      - main
    paths:
      - "weimo-wdf-ts/**"
      - ".github/workflows/ci-ts.yml"
  pull_request:
    paths:
      - "weimo-wdf-ts/**"
      - ".github/workflows/ci-ts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weimo-wdf-ts
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weimo-wdf-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
